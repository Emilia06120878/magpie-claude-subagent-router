<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Subagent Router</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="hero">
      <div class="heading">
        <img src="icon.svg" alt="" width="38" height="38">
        <div>
          <div class="eyebrow">MAGPIE · CLAUDE CODE</div>
          <h1 id="title">Claude Subagent Router</h1>
          <p id="subtitle" class="subtitle"></p>
        </div>
      </div>
      <span id="language" class="language"></span>
    </header>

    <section class="summary" aria-label="Status">
      <div><strong id="selected-count">0</strong><span id="selected-label"></span></div>
      <div><strong id="agent-count">0</strong><span id="agent-label"></span></div>
      <div><strong id="catalog-count">0</strong><span id="catalog-label"></span></div>
    </section>

    <section class="routing-options">
      <label for="routing-mode" id="routing-mode-label"></label>
      <select id="routing-mode">
        <option value="strict"></option>
        <option value="prefer"></option>
      </select>
      <span id="routing-mode-help"></span>
    </section>

    <section class="toolbar">
      <label class="search">
        <span class="sr-only" id="search-label"></span>
        <input id="search" type="search" autocomplete="off" spellcheck="false">
      </label>
      <div class="segmented" role="group" aria-label="Model filter">
        <button id="filter-all" type="button" aria-pressed="true"></button>
        <button id="filter-selected" type="button" aria-pressed="false"></button>
      </div>
      <button id="clear" class="quiet" type="button"></button>
    </section>

    <div id="notice" class="notice" hidden role="status"></div>
    <main id="models" class="models" aria-live="polite"></main>
    <div id="empty" class="empty" hidden>
      <strong id="empty-title"></strong>
      <p id="empty-text"></p>
    </div>

    <footer class="footer">
      <p id="help" class="help"></p>
      <div class="actions">
        <span id="save-status" class="save-status" role="status"></span>
        <button id="reset" class="quiet" type="button"></button>
        <button id="apply" class="primary" type="button"></button>
      </div>
    </footer>
  </div>
  <script src="_magpie/bridge.js"></script>
  <script src="catalog.js"></script>
  <script src="status.js"></script>
  <script src="app.js"></script>
</body>
</html>
